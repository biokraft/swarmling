[package]
name = "swarmling"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A sleek terminal torrent finder and downloader with a built-in VPN kill switch"
authors = ["Seán Baufeld"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/biokraft/swarmling"
keywords = ["torrent", "tui", "cli", "magnet", "vpn"]
categories = ["command-line-utilities"]
exclude = ["docs/", ".github/", "preview/"]

[lib]
name = "swarmling"
path = "src/lib.rs"

[[bin]]
name = "swarmling"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
async-trait = "0.1"
regex = "1"
directories = "5"
librqbit = "9"
if-addrs = "0.13"
ratatui = "0.30"
arboard = { version = "3", default-features = false }
crossterm = { version = "0.29", features = ["event-stream"] }

[dev-dependencies]
# `test-util` gives the tests a paused clock, so a timeout can be proved
# without any real waiting.
tokio = { version = "1", features = ["test-util"] }
wiremock = "0.6"
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1

[lints.clippy]
all = { level = "warn", priority = -1 }
